<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Контакты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
    <div class="row">
        <div class="col-2 p-3 mb-2 vh-100 bg-black text-white">
            <nav class="navbar">
                <div class="container-fluid">
                    <a class="navbar-brand text-white">
                        <img src="https://getbootstrap.com//docs/5.3/assets/brand/bootstrap-logo.svg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                        Меню
                    </a>
                    <hr class="my-4">
                    <nav class="nav flex-column">
                        <hr class="my-4">
                        <a class="nav-link" href="index.html#">Главная</a>
                        <a class="nav-link" href="category.html">Категории</a>
                        <a class="nav-link" href="#">Заказы</a>
                        <a class="nav-link" href="contact.html">Контакты</a>
                    </nav>
                </div>
            </nav>
            <hr class="my-4">
            <!-- Выпадающее меню пользователя -->
            <div class="dropdown position-absolute bottom-0 start-0 mb-3 ms-3">
                <button class="btn btn-secondary dropdown-toggle bg-black" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
                    Пользователь
                </button>
                <ul class="dropdown-menu dropdown-menu-start bg-secondary" aria-labelledby="dropdownMenuButton">
                    <li><a class="dropdown-item" href="#">Профиль</a></li>
                    <li><a class="dropdown-item" href="#">Выход</a></li>
                </ul>
            </div>
        </div>
        <div class="col-10 mt-5">
            <h1 style="text-align: center;">Контакты</h1>
            <div class="row">
                <div class="col-5 m-3 p-3">
                    <form>
                        <div class="mb-3">
                            <label for="InputName1" class="form-label">Имя</label>
                            <input type="password" class="form-control" id="InputName1">
                        </div>
                        <div class="mb-3">
                            <label for="InputEmail1" class="form-label">Почта</label>
                            <div class="input-group mb-3">
                                <button class="btn btn-outline-secondary" type="button" id="button-addon">@</button>
                                <input type="email" class="form-control" id="InputEmail1" aria-describedby="emailHelp">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="textarea1" class="form-label">Сообщение</label>
                            <textarea class="form-control" id="textarea1" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Отправить</button>
                    </form>
                </div>
                <div class="col-5 m-3 p-3">
                    <div class="bg-light m-3 p-3 text-left">
                        <h4>Наши контакты</h4>
                        <p>Это пример стилизованного блока с текстом.</p>
                        <p>Здесь в дальнейшем будет размещен информационный текст</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
